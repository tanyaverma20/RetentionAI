name: RetentionAI CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Node.js Backend & API Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Verify Backend Code Syntax
        run: |
          cd server
          node --check src/app.js

      - name: Run Backend Unit & Supertest Integration Suite
        run: |
          cd server
          npm test
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: 'ci-test-jwt-access-secret-32-chars-min'
          JWT_REFRESH_SECRET: 'ci-test-jwt-refresh-secret-32-chars-min'
          MONGODB_URI: 'mongodb://127.0.0.1:27017/retentionai_test'
          CORS_ORIGINS: 'http://localhost:5173'

  ai-service-tests:
    name: Python FastAPI AI Service & PyTest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AI Service Dependencies
        run: |
          cd ai-service
          pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov httpx

      - name: Verify Python Code Syntax
        run: |
          cd ai-service
          python -m py_compile app/main.py

      - name: Run PyTest Test Suite with Coverage
        run: |
          cd ai-service
          pytest --cov=app --cov-report=term-missing tests/
        env:
          APP_ENV: test
          MODEL_DIR: ./models
          AI_STACK_CAPABILITY: LITE

  frontend-tests-and-build:
    name: React Frontend Vitest & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Run Vitest Frontend Tests
        run: |
          cd client
          npm run test

      - name: Execute Production Frontend Build
        run: |
          cd client
          npm run build
