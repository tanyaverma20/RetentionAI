name: RetentionAI CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-and-security:
    name: Backend Node.js & Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Verify Backend Code Syntax
        run: |
          cd server
          node --check src/app.js

      - name: Run Security Regression Tests
        run: |
          cd server
          npm test
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'ci-test-jwt-access-secret-32-chars-min' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci-test-jwt-refresh-secret-32-chars-min' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://127.0.0.1:27017/retentionai_test' }}

  ai-service-and-evals:
    name: Python AI Service & Quality Evaluations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AI Service Dependencies
        run: |
          cd ai-service
          pip install -r requirements.txt || true

      - name: Verify Python Code Syntax
        run: |
          cd ai-service
          python -m py_compile app/main.py

      - name: Run AI Quality Evaluation Suite
        run: |
          cd ai-service
          python evals/eval_suite.py

  frontend-build:
    name: React Frontend Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Execute Production Frontend Build
        run: |
          cd client
          npm run build
