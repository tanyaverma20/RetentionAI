name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint

  lint-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint

  test-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB_NAME: retentionai_ci
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production-use-000000
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production-use-000000
      CORS_ORIGINS: http://localhost:5173
      AI_SERVICE_URL: http://localhost:8000
      AI_SERVICE_TOKEN: ci-test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  test-ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - env:
          AI_SERVICE_TOKEN: ci-test-token
          MONGODB_URI: mongodb://127.0.0.1:27017
          GROQ_API_KEY: ci-placeholder-not-a-real-key
        run: pytest -q

  build-client:
    runs-on: ubuntu-latest
    needs: [lint-client]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-server, test-ai-service]
    strategy:
      matrix:
        service: [client, server, ai-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          tags: retentionai/${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deployment is intentionally a separate, manually-approved stage — it
  # needs real target credentials (registry login, host SSH key or platform
  # API token) configured as repository secrets, which this template
  # repository does not ship with. Wire in one of docs/deployment/*.md's
  # platforms and set the corresponding secrets before enabling the `if:`
  # below.
  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build, build-client]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - run: echo "Configure a real deployment step here (see docs/deployment/) once DEPLOY_ENABLED and the target platform's secrets are set."
